services:
  postgres:
    image: postgres:16-alpine
    container_name: hackmol7-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hackmol
      POSTGRES_PASSWORD: hackmol_dev_2026
      POSTGRES_DB: hackmol7
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
